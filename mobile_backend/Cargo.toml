[package]
name = "neocalc_backend"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
name = "neocalc_backend"

[dependencies]
uniffi = { version = "0.30.0", features = ["cli"] }
neocalc-core = { path = "../backend" }
anyhow = "1.0"
thiserror = "2.0"
once_cell = "1.19"

[build-dependencies]
uniffi = { version = "0.30.0", features = ["build"] }
