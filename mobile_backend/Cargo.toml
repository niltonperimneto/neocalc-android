[package]
name = "neocalc_backend"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]
name = "neocalc_backend"

[dependencies]
uniffi = { version = "0.32.0", features = ["cli"] }
neocalc-core = { path = "../backend" }

# Update module dependencies
reqwest = { version = "0.13.4", features = ["rustls", "blocking", "json"], default-features = false }
sha2 = "0.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
minisign-verify = "0.2.5"
semver = "1.0.28"

[build-dependencies]
uniffi = { version = "0.32.0", features = ["build"] }
