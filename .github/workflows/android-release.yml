name: Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Job 1: Auto-Tagging (Only runs on manual trigger)
  create_tag:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Calculate and Push Tag
        run: |
          echo "Manual trigger detected. Calculating new version..."
          YEAR_MONTH=$(date +'%Y.%m')
          git fetch --tags
          LAST_TAG=$(git tag -l "v$YEAR_MONTH-*" | sort -V | tail -n 1)
          
          if [ -z "$LAST_TAG" ]; then
             NEW_TAG="v$YEAR_MONTH-1"
          else
             REV=${LAST_TAG##*-}
             NEXT_REV=$((REV + 1))
             NEW_TAG="v$YEAR_MONTH-$NEXT_REV"
          fi
          
          echo "Generated Tag: $NEW_TAG"
          git tag $NEW_TAG
          git push origin $NEW_TAG

  # Job 2: Build & Release (Only runs when a tag is pushed)
  build_release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [] # Independent job
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android

      - name: Cache cargo-ndk
        id: cache-cargo-ndk
        uses: actions/cache@v3
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: ${{ runner.os }}-cargo-ndk-3.4.0

      - name: Install cargo-ndk
        if: steps.cache-cargo-ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk

      - name: Configure Keystore
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is empty!"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" > keystore.b64
          base64 -d -i keystore.b64 > android/app/keystore.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PappVersion=${{ github.ref_name }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Release and Upload
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          files: android/app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
