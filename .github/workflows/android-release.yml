name: Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Job 1: Auto-Tagging (Only runs on manual trigger)
  create_tag:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 5
    permissions:
      contents: write # Needed to push tags
    outputs:
      new_tag: ${{ steps.tag_step.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Calculate and Push Tag
        id: tag_step
        run: |
          echo "Manual trigger detected. Calculating new version..."
          YEAR_MONTH=$(date +'%Y.%m')
          git fetch --tags
          LAST_TAG=$(git tag -l "v$YEAR_MONTH-*" | sort -V | tail -n 1)
          
          if [ -z "$LAST_TAG" ]; then
             NEW_TAG="v$YEAR_MONTH-1"
          else
             REV=${LAST_TAG##*-}
             NEXT_REV=$((REV + 1))
             NEW_TAG="v$YEAR_MONTH-$NEXT_REV"
          fi
          
          echo "Generated Tag: $NEW_TAG"
          git tag $NEW_TAG
          git push origin $NEW_TAG
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT

  # Job 2: Build & Release
  build_release:
    runs-on: ubuntu-latest
    needs: create_tag
    timeout-minutes: 30
    permissions:
      contents: write # Needed to create release and upload assets
    if: |
      always() && 
      (needs.create_tag.result == 'success' || (needs.create_tag.result == 'skipped' && startsWith(github.ref, 'refs/tags/v')))
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android

      - name: Cache Rust Dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            backend
            mobile_backend
          cache-on-failure: true

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Configure Keystore
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is empty!"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" > keystore.b64
          base64 -d -i keystore.b64 > android/app/keystore.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Define Version
        id: define_version
        run: |
          if [ "${{ needs.create_tag.result }}" == "success" ]; then
            echo "Using manually created tag: ${{ needs.create_tag.outputs.new_tag }}"
            echo "version=${{ needs.create_tag.outputs.new_tag }}" >> $GITHUB_OUTPUT
          else
            echo "Using git ref tag: ${{ github.ref_name }}"
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Build with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PappVersion=${{ steps.define_version.outputs.version }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Sign Release with Minisign
        id: sign_release
        run: |
          # 1. Install Minisign
          sudo apt-get install -y minisign

          # 2. Create Checksums
          cd android/app/build/outputs/apk/release
          sha256sum *.apk > SHA256SUMS.txt
          
          # 3. Decode Secret Key
          echo "${{ secrets.MINISIGN_SECRET_KEY }}" > minisign.key
          
          # 4. Sign the Checksum file
          # -S: sign, -m: message text, -s: secret key file, -x: signature output file
          # Read password from stdin to avoid interactive prompt
          echo "${{ secrets.MINISIGN_PASSWORD }}" | minisign -S -m SHA256SUMS.txt -s minisign.key -x SHA256SUMS.txt.minisig
          
          # 5. Clean up secret
          rm minisign.key
          
      - name: Release and Upload
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.define_version.outputs.version }}
          name: Release ${{ steps.define_version.outputs.version }}
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/release/app-universal-release.apk
            android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
            android/app/build/outputs/apk/release/app-armeabi-v7a-release.apk
            android/app/build/outputs/apk/release/app-x86-release.apk
            android/app/build/outputs/apk/release/app-x86_64-release.apk
            android/app/build/outputs/apk/release/SHA256SUMS.txt
            android/app/build/outputs/apk/release/SHA256SUMS.txt.minisig
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
