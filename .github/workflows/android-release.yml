name: Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build_and_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Configure Git
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"

    - name: Determine Release Tag
      id: get_tag
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          echo "Manual trigger detected. Calculating new version..."
          YEAR_MONTH=$(date +'%Y.%m')
          git fetch --tags
          LAST_TAG=$(git tag -l "v$YEAR_MONTH-*" | sort -V | tail -n 1)
          
          if [ -z "$LAST_TAG" ]; then
             NEW_TAG="v$YEAR_MONTH-1"
          else
             REV=${LAST_TAG##*-}
             NEXT_REV=$((REV + 1))
             NEW_TAG="v$YEAR_MONTH-$NEXT_REV"
          fi
          
          echo "Generated Tag: $NEW_TAG"
          git tag $NEW_TAG
          git push origin $NEW_TAG
          echo "release_tag=$NEW_TAG" >> $GITHUB_OUTPUT
        else
          echo "Tag push detected: ${{ github.ref_name }}"
          echo "release_tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        target: armv7-linux-androideabi
        override: true
        components: rustfmt, clippy

    - name: Add Rust Targets
      run: |
        rustup target add aarch64-linux-android
        rustup target add armv7-linux-androideabi
        rustup target add i686-linux-android
        rustup target add x86_64-linux-android

    - name: Install cargo-ndk
      run: cargo install cargo-ndk

    - name: Configure Keystore
      run: |
        # Decode to file first to avoid pipe issues
        echo "$KEYSTORE_BASE64" > keystore.b64
        base64 -d keystore.b64 > android/app/keystore.jks
        ls -l android/app/keystore.jks
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    - name: Verify Keystore
      run: |
        keytool -list -v -keystore android/app/keystore.jks -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD"
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew

    - name: Build with Gradle
      working-directory: android
      run: ./gradlew assembleRelease --stacktrace
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.get_tag.outputs.release_tag }}
        release_name: Release ${{ steps.get_tag.outputs.release_tag }}
        draft: false
        prerelease: false

    - name: Upload Release Asset
      id: upload-release-asset 
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }} 
        asset_path: android/app/build/outputs/apk/release/app-release.apk
        asset_name: neocalc-${{ steps.get_tag.outputs.release_tag }}.apk
        asset_content_type: application/vnd.android.package-archive
