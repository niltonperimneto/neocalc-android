name: Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Job 1: Auto-Tagging (Only runs on manual trigger)
  create_tag:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    outputs:
      new_tag: ${{ steps.tag_step.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Calculate and Push Tag
        id: tag_step
        run: |
          echo "Manual trigger detected. Calculating new version..."
          YEAR_MONTH=$(date +'%Y.%m')
          git fetch --tags
          LAST_TAG=$(git tag -l "v$YEAR_MONTH-*" | sort -V | tail -n 1)
          
          if [ -z "$LAST_TAG" ]; then
             NEW_TAG="v$YEAR_MONTH-1"
          else
             REV=${LAST_TAG##*-}
             NEXT_REV=$((REV + 1))
             NEW_TAG="v$YEAR_MONTH-$NEXT_REV"
          fi
          
          echo "Generated Tag: $NEW_TAG"
          git tag $NEW_TAG
          git push origin $NEW_TAG
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT

  # Job 2: Build & Release
  # Runs if:
  # 1. It's a tag push (independent run)
  # 2. OR if create_tag finished successfully (manual run)
  build_release:
    runs-on: ubuntu-latest
    needs: create_tag
    if: |
      always() && 
      (needs.create_tag.result == 'success' || (needs.create_tag.result == 'skipped' && startsWith(github.ref, 'refs/tags/v')))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android

      - name: Cache cargo-ndk
        id: cache-cargo-ndk
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: ${{ runner.os }}-cargo-ndk-3.4.0

      - name: Install cargo-ndk
        if: steps.cache-cargo-ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk

      - name: Configure Keystore
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is empty!"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" > keystore.b64
          base64 -d -i keystore.b64 > android/app/keystore.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Define Version
        id: define_version
        run: |
          if [ "${{ needs.create_tag.result }}" == "success" ]; then
            echo "Using manually created tag: ${{ needs.create_tag.outputs.new_tag }}"
            echo "version=${{ needs.create_tag.outputs.new_tag }}" >> $GITHUB_OUTPUT
          else
            echo "Using git ref tag: ${{ github.ref_name }}"
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Build with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PappVersion=${{ steps.define_version.outputs.version }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Release and Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.define_version.outputs.version }}
          name: Release ${{ steps.define_version.outputs.version }}
          files: android/app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
